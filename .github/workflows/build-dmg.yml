name: Build Notes macOS DMG

on:
  workflow_call:
    inputs:
      package_dmg:
        description: Build and upload the unsigned universal DMG.
        required: false
        type: boolean
        default: true
    secrets:
      SUBMODULES_TOKEN:
        required: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pinned monorepo revision
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}
      - name: Install native build tools
        run: brew install xcodegen just
      - name: Validate Notes
        run: |
          just test
          just release
      - name: Build unsigned universal DMG
        if: inputs.package_dmg
        run: |
          mkdir -p release
          mkdir -p release/dmg-root
          cp -R .build/xcode-release/Build/Products/Release/Notes.app release/dmg-root/
          hdiutil create -volname Notes -srcfolder release/dmg-root -ov -format UDZO release/Notes-macOS.dmg
      - name: Upload Notes DMG
        if: inputs.package_dmg
        uses: actions/upload-artifact@v4
        with:
          name: Notes-macOS
          path: release/Notes-macOS.dmg
          if-no-files-found: error
          retention-days: 14
